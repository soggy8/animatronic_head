<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Nikola{% endblock %}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 14px;
      padding: 2.5rem 2.25rem;
      width: 100%;
      max-width: 420px;
    }

    .logo {
      font-size: 3.2rem;
      text-align: center;
      margin-bottom: 0.4rem;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 0.2rem;
    }

    h2 {
      font-size: 0.95rem;
      font-weight: 400;
      color: #8b949e;
      text-align: center;
      margin-bottom: 0;
    }

    .divider {
      border: none;
      border-top: 1px solid #30363d;
      margin: 1.6rem 0;
    }

    label {
      display: block;
      font-size: 0.83rem;
      color: #8b949e;
      margin-bottom: 0.4rem;
    }

    input[type="text"],
    input[type="password"],
    textarea {
      width: 100%;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 7px;
      color: #e6edf3;
      font-size: 1rem;
      padding: 0.65rem 0.9rem;
      outline: none;
      transition: border-color 0.15s;
      font-family: inherit;
    }

    input:focus, textarea:focus {
      border-color: #388bfd;
      box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.1);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.5;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.7rem 1rem;
      border: none;
      border-radius: 7px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      margin-top: 1rem;
      letter-spacing: 0.01em;
    }

    .btn:hover  { opacity: 0.88; }
    .btn:active { transform: scale(0.98); }

    .btn-green { background: #238636; color: #fff; }
    .btn-blue  { background: #1f6feb; color: #fff; }

    .error-box {
      background: rgba(218, 54, 51, 0.1);
      border: 1px solid rgba(218, 54, 51, 0.4);
      border-radius: 7px;
      color: #f85149;
      font-size: 0.88rem;
      padding: 0.65rem 0.9rem;
      margin-bottom: 1rem;
    }

    .field + .field { margin-top: 1rem; }

    {% block extra_style %}{% endblock %}
  </style>
</head>
<body>
  {% block content %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
